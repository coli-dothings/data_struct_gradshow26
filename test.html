    <title>Move Div Animated</title>
    <style>
        /* Test to move a div to middle of PARENT div then return */
        .box {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            border-radius: 8px; 
            position: absolute;
            top: 1000px;
            left: 20px;

            transition: all 0.6s ease-in-out;
        }
        .parent {
            position: relative;
            width: 60vw;
            height: 3000px;
            border: 2px solid red;
        }
        .center {
            position: fixed;
            top: 50vh;
            left: 30vw;
            transform: translate(-50%, -50%);
        }

        button {
            position: fixed;
            z-index: 2;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

    <button onclick="moveToLocation()">Move</button>
    
    <div class="parent"><div id="myDiv" class="box"></div></div>
